<head>

<title>Antrenament și kcal</title>
<style>
:root,[data-t="ocean"]{--bg:#eaf2fb;--card:#fff;--ink:#0f2742;--mute:#5f7690;--line:#d6e3f1;--acc:#1d6fe8;--hi:#ffc833;--ok:#14a76c;--bad:#e04b4b;--grad:linear-gradient(135deg,#1d6fe8,#4fb3ff)}
[data-t="padure"]{--bg:#eef5ee;--card:#fff;--ink:#12301f;--mute:#5d7a66;--line:#d5e4d6;--acc:#1f9d55;--ok:#1f9d55;--grad:linear-gradient(135deg,#1f9d55,#7bd88f)}
[data-t="apus"]{--bg:#fbf0f3;--card:#fff;--ink:#3a1730;--mute:#8a6479;--line:#f0d9e1;--acc:#d6336c;--ok:#16a085;--grad:linear-gradient(135deg,#d6336c,#ff8a5c)}
[data-t="noapte"]{--bg:#0e1626;--card:#17233b;--ink:#eaf0fb;--mute:#93a3c2;--line:#2a3a5a;--acc:#6f95ff;--ok:#3ccf82;--bad:#ff7a7a;--grad:linear-gradient(135deg,#3d6bff,#8a5cff)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1,h2{margin:0;line-height:1.05;font-weight:800;letter-spacing:-.5px}
h1{font-size:30px}h2{font-size:24px}
select,input,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input:not([type]){padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-width:0;width:100%}
.mute{color:var(--mute)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.bar b{display:block;height:100%;background:var(--ok);transition:width .25s}
.bar.over b{background:var(--bad)}
.btn{border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;padding:12px 16px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.x{border:0;background:none;color:var(--mute);font-size:22px;padding:4px 8px;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.day{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;text-align:center;cursor:pointer;font-weight:600}
.day i{display:block;width:8px;height:8px;border-radius:50%;background:var(--line);margin:4px auto 0}
.day.rest{opacity:.55}.day.has i{background:var(--acc)}.day.full i{background:var(--ok)}
.day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.ex input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok);flex:none}
.ex.done .n{text-decoration:line-through;color:var(--mute)}
.kg{width:76px!important;text-align:center;flex:none}
.n{font-weight:600}.m{color:var(--mute);font-size:14px}
.food{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.grid2{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-top:10px}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.time{font-size:72px;font-weight:800;text-align:center;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:18px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg .btn{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.seg .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:10px 0 8px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.card,.ex,.day{border:0;box-shadow:0 2px 10px rgba(20,40,70,.08)}
.card{border-radius:18px;padding:16px}.ex{border-radius:14px}.day{border-radius:12px}
.day.sel,.seg .btn.on{background:var(--acc);color:#fff}
.btn{border-radius:12px}h1{font-size:32px}
.hero{background:var(--grad);color:#fff}.hero .mute{color:rgba(255,255,255,.85)}
.hero .bar{background:rgba(255,255,255,.3)}.hero .bar b{background:#fff}.hero .bar.over b{background:#ffd54d}
.hero .btn.alt{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
nav{border-top:0;box-shadow:0 -4px 18px rgba(20,40,70,.12);border-radius:18px 18px 0 0}
.th{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.th.on{border-color:var(--ink)}
#thm{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:5;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 10px rgba(20,40,70,.18);font-size:20px;cursor:pointer;padding:0}
#thp{position:fixed;top:calc(60px + env(safe-area-inset-top));right:14px;z-index:5;display:flex;gap:10px;background:var(--card);padding:12px;border-radius:16px;box-shadow:0 6px 24px rgba(20,40,70,.25)}
#thp[hidden]{display:none}
main{padding-top:20px}h1{padding-right:56px}
.ex.done{background:#E1F5EE;color:#085041}.ex.done .m,.ex.done .n{color:#0F6E56}
</style>
</head>
